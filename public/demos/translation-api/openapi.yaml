openapi: 3.0.3
info:
  title: Translation Management Service API
  version: "1.0"
  description: >
    API for storing, tagging, searching and exporting translations across
    multiple locales for frontend consumption (e.g. Vue.js / vue-i18n).
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: Locales
  - name: Tags
  - name: Translations

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user and receive an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { description: Validation error }

  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { description: Invalid credentials }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current API token
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { description: Unauthenticated }

  /locales:
    get:
      tags: [Locales]
      summary: List registered locales
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Locales]
      summary: Register a new locale (add support for a new language)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, example: de }
                name: { type: string, example: German }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Locale' }
        '422': { description: Validation error }

  /tags:
    get:
      tags: [Tags]
      summary: List tags
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /translations:
    get:
      tags: [Translations]
      summary: Search translations by key, content, tag and/or locale
      security: [{ bearerAuth: [] }]
      parameters:
        - name: key
          in: query
          schema: { type: string }
          description: Substring match against the translation key
        - name: content
          in: query
          schema: { type: string }
          description: Substring match against any locale's value
        - name: tag
          in: query
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TranslationKey' }
    post:
      tags: [Translations]
      summary: Create a translation key with optional tags and per-locale values
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslationWriteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TranslationKey' }
        '422': { description: Validation error }

  /translations/{id}:
    get:
      tags: [Translations]
      summary: View a translation key with its tags and locale values
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TranslationKey' }
        '404': { description: Not found }
    put:
      tags: [Translations]
      summary: Update a translation key's key/description/tags/values
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslationWriteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TranslationKey' }
        '422': { description: Validation error }
    delete:
      tags: [Translations]
      summary: Delete a translation key and all of its locale values
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }

  /translations/export:
    get:
      tags: [Translations]
      summary: Export every active locale as a nested { locale: { key: value } } map
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: string }
                example:
                  en: { home.welcome: "Welcome!" }
                  fr: { home.welcome: "Bienvenue!" }

  /translations/export/{locale}:
    get:
      tags: [Translations]
      summary: Export a single locale as a flat { key: value } map (vue-i18n ready)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: locale
          in: path
          required: true
          schema: { type: string, example: en }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
                example:
                  home.welcome: "Welcome!"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Sanctum personal access token"

  schemas:
    AuthResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
        token: { type: string }

    Locale:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }

    TranslationKey:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        translations:
          type: object
          additionalProperties: { type: string }
          example: { en: "Welcome!", fr: "Bienvenue!" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TranslationWriteRequest:
      type: object
      properties:
        key: { type: string, example: home.welcome }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          example: [web, mobile]
        translations:
          type: object
          additionalProperties: { type: string }
          example: { en: "Welcome!", fr: "Bienvenue!" }
